databases:
  - name: ongil-db
    databaseName: ongil_tour
    user: ongil
    # 무료 Postgres는 생성 30일 후 접근 자체가 막혀서(9/21 출시 전에 만료됨) 유료로 시작.
    # 가장 저렴한 유료 티어(0.1 CPU / 256MB)로 설정.
    plan: 0.1c-256mb
    postgresMajorVersion: "16"

services:
  - type: redis
    name: ongil-redis
    plan: free
    ipAllowList: []

  - type: web
    name: ongil-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    envVars:
      - key: ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: ongil-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: ongil-redis
          property: connectionString
      - key: JWT_SECRET_KEY
        sync: false
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "30"
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: "14"
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: KAKAO_REST_API_KEY
        sync: false
      - key: KAKAO_JS_KEY
        sync: false
      - key: TOUR_API_KEY
        sync: false
      - key: TOUR_API_BASE_URL
        value: https://apis.data.go.kr/B551011/KorService2
